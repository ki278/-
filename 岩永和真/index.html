<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>かんたん家計簿</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =========================
         ログイン画面
    ========================== -->
    <div id="loginScreen" class="container">
      <h1>💰 かんたん家計簿</h1>

      <div class="login-box">
        <h2>ログイン</h2>

        <input type="text" id="loginUsername" placeholder="ユーザー名" />

        <input type="password" id="loginPassword" placeholder="パスワード" />

        <button onclick="login()">ログイン</button>

        <p id="loginMessage"></p>

        <hr />

        <h3>アカウントを持っていない方</h3>

        <input
          type="text"
          id="registerUsername"
          placeholder="新しいユーザー名"
        />

        <input
          type="password"
          id="registerPassword"
          placeholder="新しいパスワード"
        />

        <button onclick="register()">新規登録</button>

        <p id="registerMessage"></p>
      </div>
    </div>

    <!-- =========================
         家計簿画面
    ========================== -->
    <div id="kakeiboScreen" class="container hidden">
      <div class="header">
        <h1>💰 かんたん家計簿</h1>

        <div>
          <span id="welcomeUser"></span>
          <button class="logout-button" onclick="logout()">ログアウト</button>
        </div>
      </div>

      <!-- =========================
             収支表示
        ========================== -->

      <div class="summary">
        <div class="summary-box income">
          <h3>収入</h3>
          <p id="totalIncome">¥0</p>
        </div>

        <div class="summary-box expense">
          <h3>支出</h3>
          <p id="totalExpense">¥0</p>
        </div>

        <div class="summary-box balance">
          <h3>残高</h3>
          <p id="balance">¥0</p>
        </div>
      </div>

      <!-- =========================
             入力フォーム
        ========================== -->

      <div class="form-box">
        <h2>家計簿を登録</h2>

        <form id="kakeiboForm">
          <label>種類</label>

          <select id="type">
            <option value="income">収入</option>
            <option value="expense">支出</option>
          </select>

          <label>日付</label>

          <input type="date" id="date" required />

          <label>カテゴリ</label>

          <select id="category">
            <option value="食費">食費</option>
            <option value="交通費">交通費</option>
            <option value="光熱費">光熱費</option>
            <option value="家賃">家賃</option>
            <option value="給料">給料</option>
            <option value="その他">その他</option>
          </select>

          <label>金額</label>

          <input
            type="number"
            id="amount"
            placeholder="例：1000"
            min="1"
            required
          />

          <label>メモ</label>

          <input type="text" id="memo" placeholder="例：スーパーで買い物" />

          <button type="submit">登録する</button>
        </form>
      </div>

      <!-- =========================
             家計簿一覧
        ========================== -->

      <div class="list-box">
        <h2>家計簿一覧</h2>

        <table>
          <thead>
            <tr>
              <th>日付</th>
              <th>種類</th>
              <th>カテゴリ</th>
              <th>金額</th>
              <th>メモ</th>
              <th>削除</th>
            </tr>
          </thead>

          <tbody id="kakeiboList"></tbody>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
